name: Deploy Atlas database and Edge Function
on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref vvozgyaikmeeeqfansrn --password "$SUPABASE_DB_PASSWORD"
      - name: Apply database migration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes
      - name: Configure Edge Function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PUBLIC_KEY: ${{ secrets.ATLAS_SUPABASE_PUBLISHABLE_KEY }}
          SECRET_KEY: ${{ secrets.ATLAS_SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$PUBLIC_KEY" ] || [ -z "$SECRET_KEY" ]; then echo "Set ATLAS_SUPABASE_PUBLISHABLE_KEY and ATLAS_SUPABASE_SECRET_KEY in GitHub Actions secrets."; exit 1; fi
          supabase secrets set "SUPABASE_PUBLISHABLE_KEY=$PUBLIC_KEY" "SUPABASE_SECRET_KEY=$SECRET_KEY" --project-ref vvozgyaikmeeeqfansrn
      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy atlas-api --project-ref vvozgyaikmeeeqfansrn --no-verify-jwt
