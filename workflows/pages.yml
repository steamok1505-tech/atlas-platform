name: Deploy Atlas frontends to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Inject public Supabase publishable key
        env:
          PUBLIC_KEY: ${{ secrets.ATLAS_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$PUBLIC_KEY" ]; then echo "Add ATLAS_SUPABASE_PUBLISHABLE_KEY in GitHub repository Actions secrets."; exit 1; fi
          sed -i "s|PASTE_YOUR_FULL_SB_PUBLISHABLE_KEY_HERE|$PUBLIC_KEY|g" worker/config.js admin/config.js
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
